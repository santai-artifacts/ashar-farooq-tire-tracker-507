<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tire Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9" />
            <circle cx="12" cy="12" r="3.5" />
            <path d="M12 3v4M12 17v4M3 12h4M17 12h4" />
          </svg>
        </div>
        <div>
          <h1>Tire Tracker</h1>
          <p>Tread, pressure &amp; wear</p>
        </div>
      </div>

      <div class="garage-head">
        <span>Garage</span>
        <button class="btn-icon" id="addVehicleBtn" title="Add vehicle" aria-label="Add vehicle">+</button>
      </div>
      <nav class="vehicle-list" id="vehicleList"></nav>
    </aside>

    <main class="main" id="main">
      <!-- rendered by app.js -->
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Edit</h2>
        <button class="btn-icon" id="modalClose" aria-label="Close">&times;</button>
      </div>
      <form id="modalForm" class="modal-body"></form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
